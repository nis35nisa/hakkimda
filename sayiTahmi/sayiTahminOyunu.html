<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sayı Tahmin Oyunu!</title>
    <link rel="stylesheet" href="sayiStyle.css">
</head>
<body>
    <div class="game-container">
        <h1>Sayı Tahmin Oyunu</h1>
        <p>1 ile 100 arasında bir sayı tuttum. Bakalım tahmin edebilecek misin?</p>
        <input type="number" id="guess-input" placeholder="Tahmininizi girin" />
        <button id="submit-btn">Tahmin Et</button>
        <p id="feedback"></p>
        <p>Deneme Sayısı: <span id="attempts">0</span></p>
    </div>
    <script src="app5.js"></script> 
</body>
</html>
