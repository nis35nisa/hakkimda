<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basit Döviz Çevirici</title>
    <link rel="stylesheet" href="renkler.css">
</head>
<body>
    <div class="converter-container">
        <h1>Döviz Çevirici</h1>
        <input type="number" id="amount" placeholder="Miktar">
        <select id="currency">
            <option value="0.85">Euro</option>
            <option value="1.1">Dolar</option>
            <option value="15">Türk Lirası</option>
        </select>
        <button id="convert-btn">Çevir</button>
        <p id="result"></p>
    </div>
    <script src="app2.js"></script> 

</body>
</html>
