<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarih Hesaplayıcı</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator-container">
        <h1>Tarih Hesaplayıcı</h1><hr>
        <label for="date-input">Başlangıç Tarihini Seçin:</label><br>
        <input type="date" id="date-input"> <br><br>
        <label for="days-input">Kaç Gün Sonrası?</label>
        <input type="number" id="days-input" placeholder="Gün sayısı"><br><br>
        <button id="calculate-btn">Hesapla</button>
        <p id="result"></p>
    </div>
    <script src="app.js"></script> 
</body>
</html>
