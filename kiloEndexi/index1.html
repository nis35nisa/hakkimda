<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Hesaplayıcı</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="bmi-container">
        <h1>BMI Hesaplayıcı</h1>
        <label for="weight-input">Kilonuzu (kg) girin:</label>
        <input type="number" id="weight-input" placeholder="Örneğin 70">
        <label for="height-input">Boyunuzu (m) girin:</label>
        <input type="number" id="height-input" placeholder="Örneğin 1.75">
        <button id="calculate-btn">Hesapla</button>
        <p id="result"></p>
    </div>
    <script src="app1.js"></script>
</body>
</html>
